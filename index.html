<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <title>Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>Controle de Produtos</h1>
    <br />
    <h3>Adicionar Produto</h3>
    <input id="nome" size="50" placeholder="Nome" /> <br />
    <input id="preco" placeholder="Preço" /><br />
    <button id="btn-adicionar">salvar</button>
    <hr />
    <h3>Pesquisar Produtos</h3>
        <input id="pesquisa" type="text" size="50" placeholder="Digite o nome do produto" />
        <button id="btn-pesquisar">Pesquisar</button>
        <button id="btn-limpar">Limpar</button>
    <hr />

    <table id="lista-produtos"></table>

    <script src="script.js"></script>

</body>

</html>
